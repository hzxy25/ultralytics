# yolo11-cls-large.yaml - 适用于5000类细粒度分类的大模型
task: classify
nc: 5000
depth_multiple: 1.0
width_multiple: 1.25

# 模型缩放配置
scales:
  l: [1.0, 1.25, 2048]  # depth, width, max_channels

backbone:
  # [from, repeats, module, args]
  # 阶段1：浅层特征提取 (P1/2)
  - [-1, 1, ODConv2d, [48, 3, 2, 1, 1, 1]]    # 0
  - [-1, 1, EMA, [48]]                        # 1

  # 阶段2：中级特征 (P2/4)
  - [-1, 1, ODConv2d, [96, 3, 2, 1, 1, 4]]    # 2
  - [-1, 2, C2fPSAODSwin, [96, 0.5, 2, 7]]    # 3

  # 阶段3：深层特征 (P3/8)
  - [-1, 1, ODConv2d, [192, 3, 2, 1, 1, 4]]   # 4
  - [-1, 3, C2fPSAODSwin, [192, 0.5, 4, 7]]   # 5
  - [-1, 1, SPPF, [192, 5]]                   # 6

  # 阶段4：高级特征 (P4/16)
  - [-1, 1, ODConv2d, [384, 3, 2, 1, 1, 4]]   # 7
  - [-1, 4, C2fPSAODSwin, [384, 0.5, 6, 7]]   # 8
  - [-1, 1, EMA, [384]]                       # 9

  # 阶段5：最高级特征 (P5/32)
  - [-1, 1, ODConv2d, [512, 3, 2, 1, 1, 4]]   # 10
  - [-1, 4, C2fPSAODSwin, [512, 0.5, 8, 7]]   # 11
  - [[6, 9, 11], 1, BiFPN, [512, 512, 2]]     # 12 多尺度融合

# 分类头
head:
  - [-1, 1, nn.AdaptiveAvgPool2d, [1]]        # 13
  - [-1, 1, nn.Dropout, [0.5]]                # 14
  - [-1, 1, ODConv2d, [nc, 1, 1, 0, 1, 1]]  # 15 分类层
  - [-1, 1, nn.Flatten, []]                   # 16
