# 参数部分
nc: 200  # 细粒度任务类别通常较多
scales:
  s: [0.67, 0.75, 1024]  # 增加深度和宽度

# 增强的主干网络
backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0
  - [-1, 1, SE, [16]]            # 1
  - [-1, 1, Conv, [128, 3, 2]]  # 2
  - [-1, 2, C3k2, [256]]        # 3
  - [-1, 1, CBAM, []]        # 4
  - [-1, 1, Conv, [256, 3, 2]]  # 5
  - [-1, 2, C3k2, [512]]        # 6
  - [-1, 1, CBAM, []]        # 7
  - [-1, 1, Conv, [512, 3, 2]]  # 8
  - [-1, 2, C3k2, [1024]]       # 9
  - [-1, 1, STN, []]            # 10 空间变换
  - [-1, 1, Conv, [1024, 3, 2]] # 11
  - [-1, 2, C3k2, [1024]]       # 12
  - [-1, 2, C2PSA, [1024]]      # 13
  - [[6, 9, 13], 1, BiFPN, [512, 2]]  # 14 特征金字塔

# 增强的分类头
head:
  - [-1, 1, ASPP, [512]]       # 15 多尺度池化
  - [-1, 1, Classify, [nc]]    # 16