# Ultralytics YOLO11-cls image classification model for fine-grained tasks
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/classify

# Parameters
nc: 1000  # number of classes
scales:  # model compound scaling constants
  n: [0.50, 0.25, 1024]  # summary: 86 layers, 1633584 parameters, 1633584 gradients, 0.5 GFLOPs
  s: [0.50, 0.50, 1024]  # summary: 86 layers, 5545488 parameters, 5545488 gradients, 1.6 GFLOPs
  m: [0.50, 1.00, 512]   # summary: 106 layers, 10455696 parameters, 10455696 gradients, 5.0 GFLOPs
  l: [1.00, 1.00, 512]   # summary: 176 layers, 12937104 parameters, 12937104 gradients, 6.2 GFLOPs
  x: [1.00, 1.50, 512]   # summary: 176 layers, 28458544 parameters, 28458544 gradients, 13.7 GFLOPs

backbone:
  # 初始卷积层 (保持高分辨率信息)
  - [-1, 1, Conv, [64, 3, 1]]  # 0 (减少下采样)

  # 特征提取阶段
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P1/2
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2

  # 增强局部特征提取 (细粒度关键)
  - [-1, 1, Conv, [256, 3, 1]]  # 3 (减少下采样)
  - [-1, 2, C2fAttn, [512, 256, 4, 512]]  # 4 区域注意力 (增加头数)

  # 多尺度特征融合
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P2/4
  - [-1, 2, C3k2, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P3/8
  - [-1, 2, C2fAttn, [1024, 512, 8, 1024]]  # 8 更强注意力 (增加头数)

  # Transformer增强 (捕获全局关系)
  - [-1, 2, C2PSA, [1024]]  # 9 Transformer注意力

  # 高分辨率特征融合 (细粒度关键)
  - [[4, 8, 9], 1, Concat, [1]]  # 10 融合多尺度特征 (早期+中期+晚期)
  - [-1, 1, Conv, [1024, 1, 1]]  # 11 通道压缩
  - [-1, 1, SPPF, [1024, 5]]  # 12 空间金字塔池化

head:
  - [-1, 1, Classify, [nc]]  # 分类头
